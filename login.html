<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Project Omega</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <h2>Login to Project Omega</h2>
  <div id="login-box">
    <label for="username">Username</label><br>
    <input type="text" id="username" name="username" placeholder="Enter your username"><br><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>

    <button onclick="window.location.href='dashboard.html'">Login</button><br><br>
 
  </div>
   <h2>Don't have an account ? Create Your Account !</h2>
  <div id="register-box">
    <label for="fullname">Full Name</label><br>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

    <label for="newpassword">Password</label><br>
    <input type="password" id="newpassword" name="newpassword" placeholder="Create a password"><br><br>

    <button onclick="window.location.href='login.html'">Register</button><br><br>
    
</body>
</html>
