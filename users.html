<p>users works!</p>
<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Manage Users</h1>

  <!-- Add / Edit Form -->
  <form (ngSubmit)="saveUser()" class="mb-6 flex gap-3 items-start">
    <input
      type="text"
      placeholder="Full name"
      [(ngModel)]="model.name"
      name="name"
      required
      class="border rounded px-3 py-2 flex-1"
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="model.email"
      name="email"
      required
      class="border rounded px-3 py-2 w-60"
    />

    <select [(ngModel)]="model.role" name="role" class="border rounded px-3 py-2">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
      {{ editing ? 'Update' : 'Add' }}
    </button>

    <button type="button" (click)="resetForm()" *ngIf="editing" class="bg-gray-200 px-3 py-2 rounded">
      Cancel
    </button>
  </form>

  <!-- Search -->
  <div class="mb-4 flex items-center gap-3">
    <input
      type="search"
      placeholder="Search by name or email"
      [(ngModel)]="filter"
      name="filter"
      class="border rounded px-3 py-2 flex-1"
    />
    <div class="text-sm text-gray-600">Total: {{ filteredUsers.length }}</div>
  </div>

  <!-- Users list -->
  <ul class="space-y-3">
    <li *ngFor="let user of filteredUsers; let i = index" class="flex items-center justify-between bg-white p-3 rounded shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-400 to-indigo-500 flex items-center justify-center text-white font-semibold text-sm">
          {{ initials(user.name) }}
        </div>
        <div>
          <div class="font-medium">{{ user.name }}</div>
          <div class="text-xs text-gray-500">{{ user.email }}</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="px-2 py-1 text-sm rounded bg-gray-100 text-gray-700">{{ user.role }}</span>
        <button (click)="startEdit(user, i)" class="text-sm px-3 py-1 border rounded hover:bg-gray-50">Edit</button>
        <button (click)="deleteUser(i)" class="text-sm px-3 py-1 bg-red-50 text-red-600 rounded hover:bg-red-100">Delete</button>
      </div>
    </li>
  </ul>

  <!-- Empty state -->
  <p *ngIf="filteredUsers.length === 0" class="mt-6 text-center text-gray-500">
    No users found.
  </p>
</div>
