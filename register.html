<h2>Student Registration Form</h2>
<form #userData="ngForm" (ngSubmit)="register(userData)">
  
  <div>
    <label for="name">Name is :</label>
    <input type="text" id="name" #username (ngModel)="username" name="username" required>
  </div>

  <div>
    <label for="email">Email is:</label>
    <input type="email" id="email" #email (ngModel)="email" name="email" required>
  </div>
  
  <div>
    <label for="batch">Password is:</label>
    <input type="password" id="batch" #password (ngModel)="password" name="password" required>
  </div>
  <div>

  <input type="submit" value="Register">
   </div>
  </form>
