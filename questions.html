<p>questions works!</p>
<div class="container mx-auto p-6 bg-white rounded-lg shadow-md mt-6">
  <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">Manage Questions</h1>

  <!-- Add Question Form -->
  <form (submit)="addQuestion()" class="mb-6 flex gap-3">
    <input
      type="text"
      [(ngModel)]="newQuestion"
      name="question"
      placeholder="Enter new question"
      class="flex-1 border px-3 py-2 rounded-md focus:ring-2 focus:ring-blue-400 focus:outline-none"
      required
    />
    <button
      type="submit"
      class="bg-blue-600 text-white px-5 py-2 rounded-md hover:bg-blue-700 transition duration-200"
    >
      Add
    </button>
  </form>

  <!-- Question List -->
  <ul class="space-y-2">
    <li
      *ngFor="let question of questions"
      class="flex justify-between items-center bg-gray-100 px-4 py-3 rounded-md shadow-sm"
    >
      <span>{{ question }}</span>
      <button
        (click)="deleteQuestion(question)"
        class="text-red-600 hover:text-red-800 font-medium"
      >
        Delete
      </button>
    </li>
  </ul>
</div>
